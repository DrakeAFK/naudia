version: 2

project_name: naudia

builds:
  - id: naudia
    main: ./cmd/naudia
    binary: naudia
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/DrakeAFK/naudia/internal/app.Version={{.Version}} -X github.com/DrakeAFK/naudia/internal/app.Commit={{.Commit}} -X github.com/DrakeAFK/naudia/internal/app.Date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

brews:
  - name: naudia
    repository:
      owner: DrakeAFK
      name: homebrew-naudia
    homepage: https://github.com/DrakeAFK/naudia
    description: Local-first AI steward for Obsidian
    license: MIT
    install: |
      bin.install "naudia"
